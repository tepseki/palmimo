schema = 1
name = "compliment-bot"
description = "顔を見つけたら、その人の服装や雰囲気を褒めてくれるアプリ。"
command = ["python", "main.py", "--model", "{model}", "--cooldown", "{cooldown}", "--stable-frames", "{stable_frames}"]
devices = ["camera", "audio", "motor_display"]

[env.OPENAI_API_KEY]
required = true
description = "褒め言葉の生成に使うOpenAI APIキー。"
help_url = "https://platform.openai.com/api-keys"

[params.model]
type = "string"
default = "gpt-4o-mini"
description = "画像対応のOpenAIモデル名。"

[params.cooldown]
type = "float"
default = 30
min = 5
max = 600
description = "褒め言葉を話す間隔（秒）。"

[params.stable_frames]
type = "int"
default = 5
min = 1
max = 60
description = "顔が連続して映ったと判断するフレーム数。"